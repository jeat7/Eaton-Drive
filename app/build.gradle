plugins { id 'com.android.application' }

// Every GitHub-signed release gets a monotonically increasing versionCode.
// The debug APK continues using the conventional source versionCode.
// Never use or store a private signing key in Git.
def signedRunNumber = System.getenv('EATON_DRIVE_SIGNED_BUILD_NUMBER')
def permanentKeystore = System.getenv('EATON_DRIVE_KEYSTORE_FILE')
def permanentKeystorePassword = System.getenv('EATON_DRIVE_STORE_PASSWORD')

android {
    buildFeatures { aidl true }
    namespace 'uk.co.eaton.drive'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.eaton.drive'
        minSdk 23
        targetSdk 32
        versionCode signedRunNumber ? 200000 + Integer.parseInt(signedRunNumber) : 17
        versionName '0.9.2'
    }
    signingConfigs {
        permanentRelease {
            // Only populated inside the explicitly invoked signed-release workflow.
            if (permanentKeystore && permanentKeystorePassword) {
                storeFile file(permanentKeystore)
                storePassword permanentKeystorePassword
                keyAlias 'eaton-drive'
                keyPassword permanentKeystorePassword
            }
        }
    }
    buildTypes {
        release {
            if (permanentKeystore && permanentKeystorePassword)
                signingConfig signingConfigs.permanentRelease
            minifyEnabled false
        }
    }
    sourceSets {
        main {
            // CI checks out BRouter 1.7.10 sources pinned to a fixed upstream commit.
            // These modules are pure Java and are compiled into our one Android APK.
            java.srcDirs += [
                "$rootDir/vendor/brouter/brouter-core/src/main/java",
                "$rootDir/vendor/brouter/brouter-mapaccess/src/main/java",
                "$rootDir/vendor/brouter/brouter-util/src/main/java",
                "$rootDir/vendor/brouter/brouter-expressions/src/main/java",
                "$rootDir/vendor/brouter/brouter-codec/src/main/java"
            ]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-map-reader:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
    testImplementation 'junit:junit:4.13.2'
}
