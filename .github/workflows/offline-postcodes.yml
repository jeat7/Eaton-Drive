name: Prepare Eaton Drive offline postcode database

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_postcodes.py'
      - '.github/workflows/offline-postcodes.yml'

permissions:
  contents: read

jobs:
  postcodes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download, clean and validate Great Britain postcode CSV
        run: python scripts/build_postcodes.py out/postcodes
      - name: Upload USB-ready postcode import package
        uses: actions/upload-artifact@v4
        with:
          name: Eaton-Drive-GB-Postcodes
          path: out/postcodes/
          if-no-files-found: error
          retention-days: 14
