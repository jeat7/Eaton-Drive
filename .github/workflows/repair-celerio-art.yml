name: Repair original Eaton Celerio artwork

on:
  push:
    paths:
      - '.github/workflows/repair-celerio-art.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and correct single corrupted artwork byte
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path("app/src/main/res/drawable-nodpi/celerio_side.webp")
          data=bytearray(path.read_bytes())
          old=hashlib.sha256(data).hexdigest()
          assert old=="7a7e411faf6d943757099fb116d33462fc3b82992865d5357b4f17ea53d965a0",old
          assert len(data)==5588,(len(data))
          assert data[2546]==0x40,hex(data[2546])
          data[2546]=0xC0
          corrected=hashlib.sha256(data).hexdigest()
          assert corrected=="945fa6827d90bea3f57d995ff67ecc47bc6422310584fb6962f9ed938bffe5cc",corrected
          path.write_bytes(data)
          print("Restored exact original approved image asset:", corrected)
          PY
      - name: Commit corrected transparent Celerio asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/celerio_side.webp
          git commit -m "Restore original transparent Suzuki Celerio artwork byte-for-byte"
          git push origin HEAD:main
