name: Eaton Drive Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected transparent Celerio dashboard artwork
        run: |
          echo "945fa6827d90bea3f57d995ff67ecc47bc6422310584fb6962f9ed938bffe5cc  app/src/main/res/drawable-nodpi/celerio_side.webp" | sha256sum -c -
      - name: Fetch MIT-licensed BRouter routing core (pinned v1.7.10)
        uses: actions/checkout@v4
        with:
          repository: abrensch/brouter
          ref: 4d2639af77ea5ed9c30d3e400764eb6f9e8522da
          path: vendor/brouter
          persist-credentials: false
      - name: Bundle driving profile and open-source licence
        run: |
          mkdir -p app/src/main/assets/brouter
          cp vendor/brouter/misc/profiles2/car-vario.brf app/src/main/assets/brouter/car-vario.brf
          cp vendor/brouter/misc/profiles2/lookups.dat app/src/main/assets/brouter/lookups.dat
          cp vendor/brouter/LICENSE app/src/main/assets/brouter/LICENSE.txt
          test -s app/src/main/assets/brouter/car-vario.brf
          test -s app/src/main/assets/brouter/lookups.dat
          grep -q '^---lookupversion:' app/src/main/assets/brouter/lookups.dat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore pre-indexed postcode asset
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/gb-postcodes.db
          key: eatondrive-gb-postcodes-2026-09-v5
      - name: Generate built-in GB postcode database
        shell: bash
        run: |
          if [ ! -s app/src/main/assets/gb-postcodes.db ]; then
            python3 scripts/build_embedded_postcodes.py
          else
            echo "Using cached pre-indexed offline postcodes"
          fi
          python3 - <<'PY'
          import sqlite3
          path="app/src/main/assets/gb-postcodes.db"
          with sqlite3.connect(f"file:{path}?mode=ro",uri=True) as db:
              count=db.execute("SELECT COUNT(*) FROM postcodes").fetchone()[0]
              assert count>1500000, count
              assert db.execute("PRAGMA quick_check").fetchone()[0]=="ok"
              print(f"Ready for APK: {count:,} indexed GB postcodes")
          PY
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Smoke-test release signing with a disposable key (never distributed)
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/throwaway-test-signing.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storetype PKCS12 \
            -alias eaton-drive -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Throwaway CI Signing Test" \
            -storepass only_for_ephemeral_ci_test -keypass only_for_ephemeral_ci_test >/dev/null 2>&1
          EATON_DRIVE_KEYSTORE_FILE="$KEYSTORE" \
          EATON_DRIVE_STORE_PASSWORD="only_for_ephemeral_ci_test" \
          EATON_DRIVE_SIGNED_BUILD_NUMBER=1 \
            gradle :app:assembleRelease --no-daemon
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk
          rm -f "$KEYSTORE" app/build/outputs/apk/release/app-release.apk
          echo "Signed-build smoke test passed; disposable key/APK discarded."
      - uses: actions/upload-artifact@v4
        with:
          name: Eaton-Drive-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
